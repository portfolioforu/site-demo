name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        working-directory: ./portfolio-testeur-dupuis
        run: bun install

      - name: Build project
        working-directory: ./portfolio-testeur-dupuis
        run: bun run build

      - name: Find output directory
        working-directory: ./portfolio-testeur-dupuis
        run: |
          if [ -d "dist" ]; then echo "BUILD_DIR=portfolio-testeur-dupuis/dist" >> $GITHUB_ENV;
          elif [ -d "build" ]; then echo "BUILD_DIR=portfolio-testeur-dupuis/build" >> $GITHUB_ENV;
          elif [ -d ".output/public" ]; then echo "BUILD_DIR=portfolio-testeur-dupuis/.output/public" >> $GITHUB_ENV;
          else echo "BUILD_DIR=portfolio-testeur-dupuis" >> $GITHUB_ENV; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
